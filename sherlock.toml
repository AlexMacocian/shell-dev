# Repository-root Sherlock configuration. The AI workspace has its own config
# in ai/sherlock.toml, with browser automation enabled only there.
#
# Entries replace same-named global entries wholesale, so each service must
# declare all required fields.

[oauth]
browser = "firefox"

[providers.sherlock-cli]
issuer = "https://id.alexandru.macocian.me/application/o/sherlock-cli/"
client_id = "1FN3B6EsTXwlN0qALiCoaKJLM23yuru80bHp5WfS"

[providers.paperless]
flow = "device"
issuer = "https://id.alexandru.macocian.me/application/o/paperless-cli/"
client_id = "sherlock-paperless-cli"

[services.searxng]
provider = "sherlock-cli"
base_url = "https://search.alexandru.macocian.me"

[services.paperless]
provider = "paperless"
base_url = "https://paperless.alexandru.macocian.me"

# Puts the OKF memory MCP in front of the agent. The bundle is always
# <project root>/knowledge — the path is not configurable.
[services.memory]
enabled = true

[mcps.servers.geo-weather]
command = "geo-weather-mcp"
